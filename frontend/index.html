<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>noteit</title>
</head>
<body>
<div class="app">
    <div class="shell">

        <!-- ░░░ LEFT · LIQUID GLASS SIDEBAR ░░░ -->
        <aside class="sidebar" id="sidebar">
            <header class="folder-head">
                <button class="folder-switch" id="folderSwitch" title="toggle tree / folder">
                    <svg class="fh-icon" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>
                    <span class="fh-name" id="folderName">devlog</span>
                    <svg class="fh-chev" id="fhChev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <button class="fh-add" id="addBtn" title="new note">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </header>

            <div class="sidebar-body" id="sidebarBody"><!-- list / tree rendered in main.ts --></div>

            <footer class="sidebar-tools">
                <button class="tool" data-tool="search" title="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg></button>
                <button class="tool" data-tool="tags" title="tags"><svg viewBox="0 0 24 24"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg></button>
                <button class="tool" data-tool="tree" title="folders"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
                <button class="tool" data-tool="settings" title="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V19a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 17.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 5 11.9H4.9a2 2 0 1 1 0-4H5a1.6 1.6 0 0 0 1.1-2.7L6 5.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 11 3.6V3.5a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8z"/></svg></button>
            </footer>
        </aside>

        <!-- ░░░ RIGHT · FLOATING DETAIL PANEL ░░░ -->
        <main class="detail" id="detail">
            <div class="detail-scroll" id="detailScroll"><!-- active note rendered in main.ts --></div>

            <!-- lualine/powerline-style statusline. Segments (mode → branch →
                 folder → file) read left-to-right with CSS powerline arrows; the
                 right cluster shows the cursor line:col. `stMsg` is the showcmd
                 area (pending leader keys + transient notices). The composer
                 field stays hidden until you enter COMPOSE scope. The whole bar
                 lives inside .detail, so it never spills under the sidebar. -->
            <div class="cmdbar" id="cmdbar">
                <div class="sl-left">
                    <span class="sl-seg sl-mode" id="mode" data-mode="normal">NORMAL</span>
                    <span class="sl-seg sl-branch" id="slBranch" hidden>⎇&nbsp;<span id="slBranchTxt"></span></span>
                    <span class="sl-seg sl-folder">
                        <svg class="sl-ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <span class="sl-txt" id="slFolder">devlog</span>
                    </span>
                    <span class="sl-seg sl-file">
                        <svg class="sl-ico" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>
                        <span class="sl-txt" id="slFile">untitled</span>
                    </span>
                </div>
                <span class="st-msg" id="stMsg"></span>
                <div class="cmd-field" id="cmdField" hidden>
                    <span class="cmd-prompt">›</span>
                    <input class="cmd-input" id="cmdInput" spellcheck="false" autocomplete="off"/>
                    <span class="bar-caret" id="barCaret"></span>
                    <span class="bar-mirror" id="barMirror" aria-hidden="true"></span>
                </div>
                <div class="sl-right">
                    <span class="sl-seg sl-pos" id="slPos">1:1</span>
                </div>
            </div>
        </main>

    </div>

    <!-- ░░░ TOP CMDLINE POPUP (nvim/noice style) ░░░ -->
    <div class="cmdline-overlay" id="cmdlineOverlay" hidden>
        <div class="cmdline">
            <div class="cmdline-frame">
                <span class="cl-legend">Cmdline</span>
                <div class="cmdline-row">
                    <span class="cl-prompt">:</span>
                    <span class="cl-text" id="clText"></span>
                </div>
            </div>
            <div class="cmdline-confirm" id="clConfirm" hidden></div>
            <ul class="cmdline-suggest" id="clSuggest"></ul>
            <div class="cmdline-foot">
                <span><kbd>tab</kbd> complete</span>
                <span><kbd>↑↓</kbd> select / history</span>
                <span><kbd>⏎</kbd> run</span>
                <span><kbd>esc</kbd> close</span>
            </div>
        </div>
    </div>

    <!-- ░░░ TOAST ░░░ -->
    <div class="toast" id="toast" hidden></div>

</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
