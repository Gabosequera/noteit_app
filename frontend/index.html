<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>noteit</title>
</head>
<body>
<div class="app">

    <!-- ░░░ LEFT SIDEBAR ░░░ -->
    <aside class="sidebar">
        <header class="sb-head">
            <span class="sb-title">~/notes</span>
            <svg class="sb-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </header>

        <nav class="sb-nav">
            <a class="nav-item is-active" data-view="notes">
                <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="lbl">notes</span><span class="count">42</span>
            </a>
            <a class="nav-item" data-view="inbox">
                <svg viewBox="0 0 24 24"><path d="M4 13l2.5-7h11L20 13M4 13v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5M4 13h4l1.5 2.5h5L16 13h4"/></svg>
                <span class="lbl">inbox</span><span class="count">7</span>
            </a>
            <a class="nav-item" data-view="daily">
                <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>
                <span class="lbl">daily</span><span class="count">12</span>
            </a>
            <a class="nav-item" data-view="projects">
                <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span class="lbl">projects</span><span class="count">9</span>
            </a>
            <a class="nav-item" data-view="snippets">
                <svg viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4M13 6l-2 12"/></svg>
                <span class="lbl">snippets</span><span class="count">28</span>
            </a>
            <a class="nav-item" data-view="archive">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="4" rx="1"/><path d="M5 9v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>
                <span class="lbl">archive</span>
            </a>
            <a class="nav-item" data-view="tags">
                <svg viewBox="0 0 24 24"><path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>
                <span class="lbl">tags</span>
            </a>
            <a class="nav-item" data-view="search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
                <span class="lbl">search</span>
            </a>
        </nav>

        <div class="sb-sep"></div>

        <div class="sb-tags">
            <div class="sb-label">TAGS</div>
            <a class="tag-item"><span class="dot" style="--c:#5ef3a8"></span><span class="lbl">go</span><span class="count">12</span></a>
            <a class="tag-item"><span class="dot" style="--c:#f0883e"></span><span class="lbl">rust</span><span class="count">8</span></a>
            <a class="tag-item"><span class="dot" style="--c:#58a6ff"></span><span class="lbl">system-design</span><span class="count">6</span></a>
            <a class="tag-item"><span class="dot" style="--c:#a371f7"></span><span class="lbl">neovim</span><span class="count">5</span></a>
            <a class="tag-item"><span class="dot" style="--c:#e3b341"></span><span class="lbl">algorithms</span><span class="count">5</span></a>
            <a class="tag-item"><span class="dot" style="--c:#39c5cf"></span><span class="lbl">docker</span><span class="count">4</span></a>
            <a class="tag-item"><span class="dot" style="--c:#db61a2"></span><span class="lbl">postgres</span><span class="count">4</span></a>
            <a class="tag-item"><span class="dot" style="--c:#bc8b54"></span><span class="lbl">security</span><span class="count">3</span></a>
        </div>

        <footer class="sb-foot">
            <button class="ic-btn" title="settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V19a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 17.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 5 11.9H4.9a2 2 0 1 1 0-4H5a1.6 1.6 0 0 0 1.1-2.7L6 5.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 11 3.6V3.5a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8z"/></svg>
            </button>
            <button class="ic-btn" title="theme">
                <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            </button>
        </footer>
    </aside>

    <!-- ░░░ CENTER: NOTE DECK (renderizado en main.ts, navegable con j/k o ↑/↓) ░░░ -->
    <main class="main">
        <section class="deck" id="deck"></section>
    </main>

    <!-- ░░░ BOTTOM COMMAND / WRITE BAR ░░░ -->
    <div class="cmdbar" id="cmdbar">
        <span class="mode" id="mode">-- INSERT --</span>
        <span class="cmd-prompt">:</span>
        <div class="cmd-field">
            <input class="cmd-input" id="cmdInput" placeholder="Write a note or command..." spellcheck="false" autocomplete="off"/>
            <span class="bar-caret" id="barCaret"></span>
            <span class="bar-mirror" id="barMirror" aria-hidden="true"></span>
        </div>
        <div class="hints">
            <span><kbd>:</kbd> command</span>
            <span class="sep"></span>
            <span><kbd>esc</kbd> normal</span>
            <span class="sep"></span>
            <span><kbd>tab</kbd> complete</span>
        </div>
    </div>

    <!-- ░░░ TOP CMDLINE POPUP (nvim/noice style) ░░░ -->
    <div class="cmdline-overlay" id="cmdlineOverlay" hidden>
        <div class="cmdline">
            <div class="cmdline-frame">
                <span class="cl-legend">Cmdline</span>
                <div class="cmdline-row">
                    <span class="cl-prompt">:</span>
                    <span class="cl-text" id="clText"></span><span class="cl-cursor"></span>
                </div>
            </div>
            <ul class="cmdline-suggest" id="clSuggest"></ul>
            <div class="cmdline-foot">
                <span><kbd>tab</kbd> complete</span>
                <span><kbd>↑↓</kbd> select / history</span>
                <span><kbd>⏎</kbd> run</span>
                <span><kbd>esc</kbd> close</span>
            </div>
        </div>
    </div>

    <!-- ░░░ TOAST ░░░ -->
    <div class="toast" id="toast" hidden></div>

</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
